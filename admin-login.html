<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123d30"><title>Admin Sign In | JOY University</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172b25;background:#f2f6f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}.top{height:68px;background:#123d30;color:white;display:flex;align-items:center;padding:0 max(calc((100vw - 1120px)/2),24px);font-size:12px;letter-spacing:1.2px}.brand{font-size:21px;font-weight:900;letter-spacing:0}.brand span{display:block;color:#b9d8c5;font-size:9px;letter-spacing:2px}.wrap{width:min(460px,calc(100% - 32px));margin:auto;padding:42px 0}.card{background:white;border:1px solid #e1eae3;border-radius:20px;padding:30px;box-shadow:0 16px 45px #1b49300d}.tag{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#36805b}.shield{width:48px;height:48px;border-radius:14px;background:#e8f3eb;color:#176b47;display:grid;place-items:center;font-size:24px;margin-bottom:18px}h1{font-size:29px;margin:8px 0}.muted{color:#708078;line-height:1.6;font-size:14px}label{display:block;font-size:13px;font-weight:650;margin:18px 0}input{display:block;width:100%;padding:13px;border:1px solid #d7e2da;border-radius:9px;margin-top:7px;font:inherit;background:white}input:focus{outline:2px solid #a5d2b4;border-color:#4b9c6a}.primary{width:100%;border:0;border-radius:10px;padding:14px;background:#176b47;color:white;font-weight:750;font-size:14px;cursor:pointer;margin-top:8px}.primary:disabled{opacity:.6;cursor:wait}.message{min-height:20px;color:#b13e36;font-size:13px;line-height:1.5}.links{text-align:center;margin-top:20px;font-size:13px}.links a{color:#176b47;font-weight:700;text-decoration:none}.links a:hover{text-decoration:underline}.secure{display:flex;gap:8px;align-items:center;background:#f1f6f2;border-radius:9px;padding:11px;font-size:11px;color:#5d7165;margin-top:18px}footer{text-align:center;color:#809087;font-size:12px;padding:22px}@media(max-width:520px){.card{padding:23px}.wrap{padding:25px 0}.top{padding:0 17px}}
</style>
</head>
<body>
<header class="top"><div class="brand">JOY <span>UNIVERSITY</span></div></header>
<main class="wrap">
<section class="card">
<div class="shield" aria-hidden="true">♙</div>
<p class="tag">ADMINISTRATOR ACCESS</p>
<h1>Admin sign in</h1>
<p class="muted">Sign in with your authorized administrator account to manage campus waste reports, collection progress and user access.</p>
<form id="adminLoginForm">
<label>Admin email<input name="email" type="email" autocomplete="username" placeholder="Enter admin email" required></label>
<label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter password" required></label>
<button class="primary" type="submit">Sign in to Admin Dashboard</button>
</form>
<p id="adminLoginMessage" class="message" role="status" aria-live="polite"></p>
<div class="secure">🔒 Administrator access is checked against your account role.</div>
<div class="links"><a href="/">← Back to user login</a></div>
</section>
</main>
<footer>JOY University · Smart Waste Management</footer>
<script src="/assets/js/admin-login.js" defer></script>
</body></html>
